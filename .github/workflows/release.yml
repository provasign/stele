name: Release
# Runs only when a release tag is pushed. Stele needs cgo (tree-sitter, via
# Grove), so every platform builds natively; Linux binaries are static so
# they run on older glibc. Adapted from Prism's release workflow.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
  id-token: write
  attestations: write
env:
  GO_VERSION: "1.26.3"
jobs:
  build-linux:
    name: Build linux/${{ matrix.goarch }}
    # arm64 builds natively on GitHub's arm runner: no cross-compiler to
    # install, so a release does not hang on Ubuntu's package mirrors.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: gcc
        run: |
          mkdir -p dist
          go build -tags netgo,osusergo -ldflags="-s -w -extldflags \"-static\" -X github.com/provasign/stele/internal/version.Version=${{ github.ref_name }}" -o "dist/stele-${{ github.ref_name }}-linux-${{ matrix.goarch }}" ./cmd/stele
      - uses: actions/upload-artifact@v7
        with:
          name: stele-linux-${{ matrix.goarch }}
          path: dist/

  build-darwin:
    name: Build darwin/${{ matrix.goarch }}
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.goarch == 'amd64' && 'clang -arch x86_64' || 'clang -arch arm64' }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X github.com/provasign/stele/internal/version.Version=${{ github.ref_name }}" -o "dist/stele-${{ github.ref_name }}-darwin-${{ matrix.goarch }}" ./cmd/stele
      - uses: actions/upload-artifact@v7
        with:
          name: stele-darwin-${{ matrix.goarch }}
          path: dist/

  release:
    name: Checksums, attestation and release
    needs: [build-linux, build-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist/
      - name: Generate checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name checksums.txt -print0 | sort -z | xargs -0 sha256sum > checksums.txt
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            install.sh
