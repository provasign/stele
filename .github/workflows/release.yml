name: Release
# Runs only when a release tag is pushed. Stele needs cgo (tree-sitter, via
# Grove, and Z3, linked in from a static libz3 so users install nothing
# else), so every platform builds natively; Linux binaries are static so
# they run on older glibc. Adapted from Prism's release workflow.
# It can also be started by hand for a tag already pushed, to finish a
# release whose run failed for reasons outside the code.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.1.15
        required: true
permissions:
  contents: write
  id-token: write
  attestations: write
env:
  GO_VERSION: "1.26.3"
  Z3_VERSION: "5.3.1"
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  # What is released is what was tested: the tag's own commit, with the
  # steps of ci.yml, before anything is published.
  test:
    name: Test the tagged commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install Z3
        run: |
          curl -fsSL -o z3.zip "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VERSION}/z3-${Z3_VERSION}-x64-glibc-2.39.zip"
          unzip -q z3.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/z3-${Z3_VERSION}-x64-glibc-2.39/bin" >> "$GITHUB_PATH"
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: Integration tests
        run: |
          go build -o bin/stele-sync ./cmd/stele
          node --test $(git ls-files 'integrations/**/*.test.js')

  build-linux:
    name: Build linux/${{ matrix.goarch }}
    # arm64 builds natively on GitHub's arm runner: no cross-compiler to
    # install, so a release does not hang on Ubuntu's package mirrors.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Cache static Z3
        id: z3
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/z3
          key: z3-static-${{ env.Z3_VERSION }}-linux-${{ matrix.goarch }}-${{ hashFiles('scripts/build-z3.sh') }}
      - name: Build static Z3
        if: steps.z3.outputs.cache-hit != 'true'
        run: scripts/build-z3.sh "$Z3_VERSION" "$RUNNER_TEMP/z3"
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: gcc
          CGO_CFLAGS: -I${{ runner.temp }}/z3/include
          CGO_LDFLAGS: -L${{ runner.temp }}/z3/lib
        run: |
          mkdir -p dist
          go test -count=1 -tags z3static ./internal/solver/
          go build -tags netgo,osusergo,z3static -ldflags="-s -w -extldflags \"-static\" -X github.com/provasign/stele/internal/version.Version=${{ env.TAG }}" -o "dist/stele-${{ env.TAG }}-linux-${{ matrix.goarch }}" ./cmd/stele
      - name: Check the binary runs Z3 with none on PATH
        run: env PATH=/usr/bin:/bin "dist/stele-${TAG}-linux-${{ matrix.goarch }}" version --solver
      - uses: actions/upload-artifact@v7
        with:
          name: stele-linux-${{ matrix.goarch }}
          path: dist/

  build-darwin:
    name: Build darwin/${{ matrix.goarch }}
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Cache static Z3
        id: z3
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/z3
          key: z3-static-${{ env.Z3_VERSION }}-darwin-${{ matrix.goarch }}-${{ hashFiles('scripts/build-z3.sh') }}
      - name: Build static Z3
        if: steps.z3.outputs.cache-hit != 'true'
        run: scripts/build-z3.sh "$Z3_VERSION" "$RUNNER_TEMP/z3" ${{ matrix.goarch == 'amd64' && 'x86_64' || 'arm64' }}
      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.goarch == 'amd64' && 'clang -arch x86_64' || 'clang -arch arm64' }}
          CGO_CFLAGS: -I${{ runner.temp }}/z3/include
          CGO_LDFLAGS: -L${{ runner.temp }}/z3/lib
          MACOSX_DEPLOYMENT_TARGET: "13.3"
        run: |
          mkdir -p dist
          if [ "${{ matrix.goarch }}" = arm64 ]; then go test -count=1 -tags z3static ./internal/solver/; fi
          go build -tags z3static -ldflags="-s -w -X github.com/provasign/stele/internal/version.Version=${{ env.TAG }}" -o "dist/stele-${{ env.TAG }}-darwin-${{ matrix.goarch }}" ./cmd/stele
      - name: Check the binary runs Z3 with none on PATH
        if: matrix.goarch == 'arm64'
        run: env PATH=/usr/bin:/bin "dist/stele-${TAG}-darwin-arm64" version --solver
      - uses: actions/upload-artifact@v7
        with:
          name: stele-darwin-${{ matrix.goarch }}
          path: dist/

  release:
    name: Checksums, attestation and release
    needs: [test, build-linux, build-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist/
      - name: Generate checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name checksums.txt -print0 | sort -z | xargs -0 sha256sum > checksums.txt
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/*
            install.sh
            NOTICE
