  reference: [PA-021-FR014]
- id: PA-021-FR015
  source: specs/021-tasks/spec.md#L41
  prose: "FR-015: When an agent fails, crashes or is cancelled, the workspace MUST stay up for inspection and the task end as failed or cancelled."
  reference: [PA-021-FR015]
- id: PA-022-FR026
  source: specs/022-chat/spec.md#L52
  prose: "FR-026: After an agent finishes, while its workspace is still up (inside the idle window), further messages to the same session MUST still be accepted; each one restarts the idle timer."
  reference: [PA-022-FR026]
- id: PA-022-FR028
  source: specs/022-chat/spec.md#L54
  prose: "FR-028: A session whose workspace is gone MUST ask the user to open a new chat instead of sending to it."
  reference: [PA-022-FR028]
- id: PA-022-FR017
  source: specs/022-chat/spec.md#L60
  prose: "FR-017: The session idle window MUST be set by an environment variable and default to 15 minutes."
  reference: [PA-022-FR017]
- id: PA-003-FR023
  source: specs/003-hosting/spec.md#L30
  prose: "FR-023: Workspaces MUST stop on their own once idle for a configurable time (30 minutes by default)."
  reference: [PA-003-FR023, PA-003-FR023-default]
- id: PA-003-FR025
  source: specs/003-hosting/spec.md#L32
  prose: "FR-025: Stopping or deleting a workspace MUST release its cloud machine."
  reference: [PA-003-FR025]
- id: PA-014-FR009
  source: specs/014-shared-hosts/spec.md#L19
  prose: "FR-009: Users MUST be able to stop, restart or delete one workspace without affecting the other workspaces on its host."
  reference: [PA-014-FR009]
- id: PA-014-FR009a
  source: specs/014-shared-hosts/spec.md#L20
