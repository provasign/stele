  source: specs/014-shared-hosts/spec.md#L22
  prose: "FR-009c: Hosts and workspaces MUST NOT be stopped automatically because they look idle; only explicit user or system actions change their lifecycle."
  reference: [PA-014-FR009c]
- id: PA-014-FR009d
  source: specs/014-shared-hosts/spec.md#L23
